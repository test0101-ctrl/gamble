<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Survivor: O Gerador</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>Last Survivor: O Gerador</h1>

        <div class="status-panel">
            <p>Dia: <span id="gameDay">1</span></p>
            <p>Gerador: <span id="generatorHealth">100%</span></p>
            <p>Energia: <span id="generatorPower">100%</span></p>
            <p>Recursos (Metal): <span id="resources">0</span></p>
        </div>

        <div class="main-game-area">
            <div class="actions">
                <h2>Ações</h2>
                <button id="mineButton">Minar Metal (Rápido)</button>
                <button id="collectFuelButton">Coletar Combustível</button>

                <h3>Construções & Reparos</h3>
                <button id="upgradeDomeButton">Construir Cúpula (100 Metal)</button>
                <button id="addWeaponButton">Construir Arma (50 Metal)</button>
                <button id="repairDomeButton" disabled>Reparar Cúpula (20 Metal)</button>
                <button id="repairWeaponsButton" disabled>Reparar Armas (10 Metal/arma)</button>
                <button id="fuelGeneratorButton" disabled>Abastecer Gerador (1 Combustível)</button>
            </div>

            <div class="base-elements">
                <div class="element-box">
                    <h3>Gerador</h3>
                    <img src="images/generator_ok.png" alt="Gerador" id="generatorImage" class="game-object">
                    <p>Estado: <span id="generatorStatus">Normal</span></p>
                </div>
                <div class="element-box">
                    <h3>Cúpula</h3>
                    <img src="images/dome_lvl0.png" alt="Cúpula" id="domeImage" class="game-object">
                    <p>Status: <span id="domeStatus">Nenhuma</span></p>
                </div>
                <div class="element-box weapons-area">
                    <h3>Defesas (Armas)</h3>
                    <div id="weaponsContainer" class="weapons-grid">
                        </div>
                </div>
            </div>
        </div>

        <div class="message-log-container">
            <h2>Registro de Eventos</h2>
            <ul id="messageLog">
                </ul>
        </div>

        <div id="gameOverScreen" class="game-over-screen">
            <h2>FIM DE JOGO!</h2>
            <p>Seu gerador foi destruído. A Terra não perdoa.</p>
            <button id="restartButton">Reiniciar Aventura</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
