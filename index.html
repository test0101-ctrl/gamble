<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Survivor: Terra Despedaçada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Last Survivor: Terra Despedaçada</h1>

        <div class="game-status">
            <p>Gerador: <span id="generatorHealth">100%</span></p>
            <p>Energia: <span id="generatorPower">100%</span></p>
            <p>Recursos: <span id="resources">0</span></p>
            <p>Tempo de Jogo: <span id="gameTime">0s</span></p>
        </div>

        <div class="actions">
            <button id="mineButton">Minar Recursos</button>
            <button id="repairDomeButton" disabled>Reparar Cúpula</button>
            <button id="repairWeaponsButton" disabled>Reparar Armas</button>
            <button id="upgradeDomeButton">Melhorar Cúpula (100 Recursos)</button>
            <button id="addWeaponButton">Adicionar Arma (50 Recursos)</button>
        </div>

        <div class="base-area">
            <div class="generator">
                <h2>Gerador de Energia</h2>
                <img src="images/generator.png" alt="Gerador de Energia" id="generatorImage">
            </div>
            <div class="dome">
                <h2>Cúpula</h2>
                <img src="images/dome.png" alt="Cúpula de Proteção" id="domeImage">
            </div>
            <div class="weapons-area">
                <h2>Armas</h2>
                <div id="weaponsContainer" class="weapons-container">
                    </div>
            </div>
        </div>

        <div class="messages">
            <h2>Alertas e Mensagens</h2>
            <ul id="messageLog">
                </ul>
        </div>

        <div id="gameOverScreen" class="game-over-screen">
            <h2>FIM DE JOGO!</h2>
            <p>Seu gerador foi destruído.</p>
            <button id="restartButton">Reiniciar Jogo</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
