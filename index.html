<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador do Apocalipse!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>Gerador do Apocalipse!</h1>

        <div class="header-status">
            <p>Dia: <span id="gameDay">1</span></p>
            <p>Gerador: <span id="generatorHealth" class="status-value">100%</span></p>
            <p>Metal: <span id="metalResources" class="status-value">0</span></p>
        </div>

        <div class="main-action-area">
            <button id="mineButton" class="big-button">CLICAR PARA MINAR METAL</button>
            <p class="mine-rate">Produção por Clique: <span id="clickProduction">1</span></p>
            <p class="idle-rate">Produção Automática: <span id="idleProduction">0</span>/seg</p>
        </div>

        <div class="upgrade-area">
            <h2>Melhorias</h2>
            <button id="upgradeClickButton" class="upgrade-button">Melhorar Clique (10 Metal)</button>
            <button id="buyDroneButton" class="upgrade-button">Comprar Drone (50 Metal)</button>
            <button id="addTurretButton" class="upgrade-button">Adicionar Torreta (100 Metal)</button>
            <button id="repairGeneratorButton" class="upgrade-button repair-button" disabled>Reparar Gerador (50 Metal)</button>
        </div>

        <div class="threat-area">
            <h2>Ameaças</h2>
            <p>Próximo Ataque em: <span id="nextAttackIn">--</span>s</p>
            <p>Dano no Ataque: <span id="attackDamage">10</span></p>
        </div>

        <div class="message-log-container">
            <h2>Registro</h2>
            <ul id="messageLog">
                </ul>
        </div>

        <div id="gameOverScreen" class="game-over-screen">
            <h2>FIM DE JOGO!</h2>
            <p>Seu gerador foi destruído pelos mutantes.</p>
            <button id="restartButton">Reiniciar</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
